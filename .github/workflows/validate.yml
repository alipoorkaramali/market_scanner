name: Data Validation

on:
  workflow_dispatch:  # فقط به صورت دستی اجرا می‌شود

jobs:
  validate:
    runs-on: ubuntu-latest
    
    steps:
      - name: دریافت کد از مخزن
        uses: actions/checkout@v4

      - name: نصب پایتون
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: نصب کتابخانه‌ها
        run: |
          pip install -r requirements.txt
          pip install matplotlib  # برای رسم نمودار

      - name: اجرای اسکریپت اعتبارسنجی
        run: python .github/scripts/validator.py

      - name: آپلود نتایج به عنوان Artifact
        uses: actions/upload-artifact@v4
        with:
          name: validation-results
          path: validation-results/
