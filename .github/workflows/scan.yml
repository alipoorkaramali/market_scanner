name: stock market Scanner

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */4 * * *'

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: دریافت کد
        uses: actions/checkout@v4

      - name: نصب پایتون
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: نصب کتابخانه‌ها
        run: pip install -r requirements.txt
        
      - name: تست FCS API
        run: |
          python -c "
          import requests, os
          url = 'https://api-v4.fcsapi.com/forex/history'
          params = {'symbol': 'EURUSD', 'period': '4h', 'limit': 5, 'access_key': os.environ.get('FCS_API_KEY')}
          print(requests.get(url, params=params).json())
          "
        env:
          FCS_API_KEY: ${{ secrets.FCS_API_KEY }}
          
      - name: اجرای اسکنر
        run: python .github/scripts/scanner.py
        env:
          FCS_API_KEY: ${{ secrets.FCS_API_KEY }}   # ← کلید از Secret خوانده می‌شود

      - name: ذخیره خروجی
        uses: actions/upload-artifact@v4
        with:
          name: scan-results
          path: |
            results/
            data/
