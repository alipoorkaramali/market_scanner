name: Crypto Scanner

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */4 * * *'

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: دریافت کد
        uses: actions/checkout@v4

      - name: نصب پایتون
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: نصب کتابخانه‌ها
        run: pip install -r requirements.txt

      - name: اجرای اسکنر
        run: python .github/scripts/scanner.py   # ← مسیر جدید

      - name: ذخیره خروجی
        uses: actions/upload-artifact@v4
        with:
          name: scan-results
          path: results/
